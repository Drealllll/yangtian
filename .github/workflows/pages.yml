name: Deploy academic homepage to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build static pages
        run: node build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Wait for uploaded artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          let ready = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(endpoint, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error(`Artifact lookup returned HTTP ${response.status}`);
            const result = await response.json();
            if (result.artifacts.some(artifact => String(artifact.id) === process.env.ARTIFACT_ID && !artifact.expired)) {
              ready = true;
              break;
            }
            await pause(5000);
          }
          if (!ready) throw new Error('Uploaded artifact did not become available in time');
          // Allow the artifact service used by deploy-pages to synchronize its index.
          await pause(15000);
          console.log('Uploaded Pages artifact is ready for deployment.');
          NODE
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
